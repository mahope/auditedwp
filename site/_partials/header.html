<a class="skip" href="#main">{{skip}}</a>
<nav class="fam" aria-label="Mahope tools">
  <div class="container">
    <span class="fam-label">Mahope tools:</span>
    <a href="https://eucomplypro.com/" aria-current="true">EUComply</a>
    <a href="https://cleancopy.tools/">Clean Copy</a>
    <a href="https://deskuptime.com/">DeskUptime</a>
    <a href="https://transmute.run/">Transmute</a>
    <a href="https://bugbottle.dev/">BugBottle</a>
    <a class="fam-all" href="https://mahope.tools/">{{fam_all}}</a>
  </div>
</nav>
<header class="sh">
  <div class="container">
    <a class="sh-brand" href="{{home}}"><svg class="sh-mark" width="24" height="24" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><rect width="32" height="32" rx="7" fill="currentColor"/><path d="M9 11h7M9 16h6M9 21h7M20 11v7a3 3 0 0 0 6 0v-7" fill="none" stroke="var(--bg)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>EUComply</a>
    <div class="sh-menu" id="sh-menu">
      <nav class="sh-nav" aria-label="{{nav_label}}">
        <a href="{{p_scan}}"{{cur_scan}}>{{nav_scan}}</a>
        <a href="{{p_book}}"{{cur_book}}>{{nav_guide}}</a>
        <a href="/checklist/"{{cur_checklist}}>{{nav_checklists}}</a>
        <a href="{{p_pricing}}"{{cur_pricing}}>{{nav_pricing}}</a>
        <a href="/blog/"{{cur_blog}}>{{nav_blog}}</a>
      </nav>
      {{langswitch}}
    </div>
    <div class="sh-tools">
      <button class="sh-btn sh-search" type="button" aria-label="{{search_label}}" title="{{search_label}} (Ctrl+K)">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <span class="sh-search-txt">{{search}}</span><kbd aria-hidden="true">Ctrl K</kbd>
      </button>
      {{langswitch}}
      <button class="sh-btn sh-theme" type="button" aria-label="{{theme_label}}" title="{{theme_label}}">
        <svg class="ic ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="ic ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="ic ic-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="sh-btn sh-toggle" type="button" aria-expanded="false" aria-controls="sh-menu" aria-label="{{menu_label}}">
        <svg class="ic ic-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        <svg class="ic ic-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>
</header>
