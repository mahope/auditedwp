<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" rx="12"/>
  <!-- subtle grid -->
  <line x1="0" y1="0" x2="0" y2="630" stroke="#1e293b" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="630" stroke="#1e293b" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="#1e293b" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="#1e293b" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="#1e293b" stroke-width="1"/>
  <line x1="1000" y1="0" x2="1000" y2="630" stroke="#1e293b" stroke-width="1"/>
  <line x1="1200" y1="0" x2="1200" y2="630" stroke="#1e293b" stroke-width="1"/>
  <!-- status indicators -->
  <circle cx="80" cy="180" r="40" fill="none" stroke="#22c55e" stroke-width="4"/>
  <circle cx="80" cy="180" r="20" fill="#22c55e" opacity="0.4"/>
  <circle cx="80" cy="320" r="40" fill="none" stroke="#f59e0b" stroke-width="4"/>
  <circle cx="80" cy="450" r="40" fill="none" stroke="#38bdf8" stroke-width="4"/>
  <!-- main text -->
  <text x="160" y="195" font-family="system-ui,-apple-system,sans-serif" font-weight="700" font-size="64" fill="#e2e8f0">DeskUptime</text>
  <text x="160" y="275" font-family="system-ui,-apple-system,sans-serif" font-weight="400" font-size="28" fill="#94a3b8">Monitor your websites from your desktop.</text>
  <text x="160" y="320" font-family="system-ui,-apple-system,sans-serif" font-weight="400" font-size="24" fill="#94a3b8">Uptime · SSL · Content changes</text>
  <!-- price pill -->
  <rect x="160" y="365" width="200" height="50" rx="25" fill="url(#accent)"/>
  <text x="260" y="396" font-family="system-ui,-apple-system,sans-serif" font-weight="700" font-size="22" fill="#0f172a" text-anchor="middle">$19 one-time</text>
  <!-- features -->
  <text x="160" y="460" font-family="system-ui,-apple-system,sans-serif" font-size="20" fill="#64748b">✓ No subscription · ✓ Mac &amp; Windows · ✓ Desktop app + CLI</text>
  <!-- bottom -->
  <text x="1200" y="590" font-family="system-ui,-apple-system,sans-serif" font-size="18" fill="#475569" text-anchor="end">deskuptime.com</text>
</svg>