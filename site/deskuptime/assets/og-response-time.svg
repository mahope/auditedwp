<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" rx="12"/>
  <line x1="200" y1="0" x2="200" y2="630" stroke="#1e293b" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="#1e293b" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="#1e293b" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="#1e293b" stroke-width="1"/>
  <line x1="1000" y1="0" x2="1000" y2="630" stroke="#1e293b" stroke-width="1"/>
  <!-- latency bars -->
  <rect x="440" y="440" width="40" height="80" rx="6" fill="#22c55e"/>
  <rect x="496" y="420" width="40" height="100" rx="6" fill="#22c55e"/>
  <rect x="552" y="430" width="40" height="90" rx="6" fill="#f59e0b"/>
  <rect x="608" y="400" width="40" height="120" rx="6" fill="#f59e0b"/>
  <rect x="664" y="370" width="40" height="150" rx="6" fill="#ef4444"/>
  <text x="160" y="185" font-family="system-ui,-apple-system,sans-serif" font-weight="700" font-size="60" fill="#e2e8f0">Website response time monitor</text>
  <text x="160" y="265" font-family="system-ui,-apple-system,sans-serif" font-weight="400" font-size="28" fill="#94a3b8">Free latency check for any URL. Then get alerted when your</text>
  <text x="160" y="305" font-family="system-ui,-apple-system,sans-serif" font-weight="400" font-size="28" fill="#94a3b8">site slows down or goes down — before visitors notice.</text>
  <rect x="160" y="355" width="200" height="50" rx="25" fill="url(#accent)"/>
  <text x="260" y="386" font-family="system-ui,-apple-system,sans-serif" font-weight="700" font-size="22" fill="#0f172a" text-anchor="middle">$19 one-time</text>
  <text x="600" y="560" font-family="system-ui,-apple-system,sans-serif" font-size="20" fill="#64748b" text-anchor="middle">✓ Any URL · ✓ Any platform · ✓ Desktop app + CLI · ✓ No subscription</text>
  <text x="1200" y="590" font-family="system-ui,-apple-system,sans-serif" font-size="18" fill="#475569" text-anchor="end">deskuptime.com</text>
