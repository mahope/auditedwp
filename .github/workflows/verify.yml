name: verify

# Kanonisk kvalitetsgate. Bruges to steder, så der kun er én definition af grøn:
#   1. på enhver pull_request — så en PR med PHP-syntaksfejl eller SEO-fejl
#      aldrig kan merge til main og dermed aldrig deploye,
#   2. fra deploy-site.yml som et job, der skal være grønt før Pages-uploads.
#
# Gateen ligger i tools/quality_gate.sh, så lokal og CI-gate er identiske.
# Der bruges ingen secrets her: PHP, node og python er alt der skal til.

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: quality gate
    # Fastsat på et konkret image, ikke ubuntu-latest: GitHub har lagt en
    # annotation på alle jobs om at `ubuntu-latest` migrerer til Ubuntu 26
    # 19. oktober 2026. Et flydende label ændrer den miljø, gaten er skrevet
    # imod (php -l, node, python3.13, wrangler) uden at nogen rører repoet.
    # Efterprøves af check_runner_pins i tools/check_runtime.py, så pin'en kan
    # ikke glide tilbage til ubuntu-latest uden at gaten bliver rød.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # `fetch-depth: 0` er ikke en hastighedsindstilling, det er en
      # forudsætning. Gaten måler `tools/apply_shell.py`s `git_dates()`, som
      # besvarer "hvornår blev denne side sidst redigeret?" **af git-historien**,
      # og skriver de svar videre i `site/sitemap.xml` og JSON-LD. Standarden er
      # `fetch-depth: 1`, altså én commit — og så svarer `git log` på intet for
      # 230 af 230 sider, så de falder på `TODAY`. Målt 28/9: CI `36485230317`
      # blev rød på `R1 sitemap.xml: linje 22` fordi den dybe lokale klon og
      # CI's klon på én commit gav to forskellige svar på det samme spørgsmål —
      # dybt cloning af HEAD reproducerede fejlen byte for byte. Se mærkningen i
      # `git_dates()`, der nu afviser en grund klon i stedet for at svare
      # `TODAY` i stilhed.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Kør kvalitetsgaten
        run: bash tools/quality_gate.sh

      - name: Hæng uploadartefaktet op, hvis det blev bygget
        if: always() && hashFiles('site-dist/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: site-dist/
          retention-days: 3
          if-no-files-found: error
