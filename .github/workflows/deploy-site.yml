name: deploy-site

# Deployer det verificerede publicerede træ til Cloudflare Pages
# (projekt "auditedwp" -> eucomplypro.com) ved push på main.
# Kilden i site/ er allerede shell-injiceret (tools/apply_shell.py køres
# lokalt). site/ er dog et fuldt arbejdstræ med interne dokumenter,
# scripts og forskningsnoter, som ikke må publiceres, så deployen
# deployer aldrig site/ direkte — den deployer site-dist/, som
# tools/build_public_tree.py bygger ud fra en positivliste og
# tools/check_public_tree.py afviser, hvis noget internt slap igennem.
#
# Verification og upload er to separate jobs: `verify` kalder den genbrugelige
# .github/workflows/verify.yml og har ingen secrets, så en rød gate stopper
# før Pages overhovedet røres. Secrets findes kun i `deploy`.

on:
  push:
    branches: [main]
    # Alle mønstre skal ende på /**. Det gjorde '.github/workflows/' ikke, og
    # GitHub matcher det ikke mod filerne i mappen: en ændring i en workflow
    # triggede aldrig denne kørsel, så den blev aldrig verificeret i CI.
    # Mærkeligt nok rammer det især de ændringer, der rører selve deployet.
    paths:
      - 'site/**'
      - 'shared/**'
      - 'worker-scan/**'
      - 'worker-watch/**'
      - 'plugin/**'
      - 'eucomply-scanner/**'
      - 'tools/**'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: pages-auditedwp
  cancel-in-progress: false

jobs:
  verify:
    name: kvalitetsgate
    uses: ./.github/workflows/verify.yml

  deploy:
    name: deploy til Cloudflare Pages
    needs: verify
    # Se kommentaren på runs-on i verify.yml: ubuntu-latest migrerer til
    # Ubuntu 26 den 19. oktober 2026, og deployet må ikke stå på et billede
    # ingen har testet.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Byg det offentlige træ
        run: |
          python3 tools/build_public_tree.py
          python3 tools/check_public_tree.py

      - name: Deploy til Cloudflare Pages
        # Fastsat på patch-niveau, ikke den flydende @v4: 4.1.0 og 4.1.1 blev
        # udgivet defekte og fejler i en workflow (issue #454). Et flydende tag
        # kan derfor trække en ny, ødelagt patch ind i selve deployet uden at
        # nogen rører workflowen. Opdateres manuelt, når en ny patch er læst.
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site-dist
          command: pages deploy . --project-name auditedwp --branch main --commit-dirty=true

  check-production:
    name: tjek produktion
    needs: deploy
    # Samme pin som de to jobs ovenfor — kontrollen skal ikke køre på et
    # andet billede end den, der uploadede.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Tjek indhold, ikke kun status
        run: |
          # 25/9: den gamle kontrol testede /IMPLEMENTATION_PLAN.md, som aldrig har
          # ligget i site/. Den var 404 før og efter rettelsen og beviser intet.
          # Nu testes stier der FAKTISK var eksponeret.
          url="https://eucomplypro.com/"
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS -o body.html -w '%{http_code}' "$url" || echo 000)
            if [ "$code" = "200" ] && grep -q "mahoje.dk" body.html; then
              echo "OK: $url svarer 200 og indeholder mahoje.dk"
              break
            fi
            echo "Forsøg $i: status $code — venter 10s"
            sleep 10
          done
          if [ "$code" != "200" ]; then
            echo "FEJL: $url gav status $code"
            exit 1
          fi

          # Lek-kontrol. Query-strengen er ikke en cache-buster, Cloudflare bruger
          # den fulde URL som cache-nøgle, så denne rammer origin og ikke kanten.
          # Det er hele pointen: de interne dokumenter lå i site/ og er væk derfra,
          # men ligger stadig cachet i kanten med s-maxage=604800 indtil de udløber
          # eller bliver purget (spørgsmål 12). Uden query-strengen ville denne
          # kontrol læse det gamle cachede indhold og fejle uden grund.
          fail=0
          for route in /AGENTS.md /BUDGET.md /DECISION.md /STATUS.md /RESEARCH.md \
                     /KANALPLAN.md /INTERVIEW-GUIDE.md /wrangler.toml \
                     /ceo-loop3.sh /ops/auditlog.py /POSTS/01-eighty-five-niches.md \
                     /IMPLEMENTATION_PLAN.md; do
            code=$(curl -sS -o leak.out -w '%{http_code}' "$url$route?cb=$GITHUB_RUN_ID" || echo 000)
            if [ "$code" = "200" ]; then
              echo "FEJL: $route svarer stadig 200 på origin"
              head -c 200 leak.out; echo
              fail=1
            else
              echo "OK: $route svarer $code (forventet 404)"
            fi
          done

          # Adgang til nøgle-sider efter et upload. HTTP 200 er ikke bevis, så
          # indholdet kontrolleres: de fire pricing-ruter og Pro skal findes.
          for route in / /pro/ /pricing/ /da/pricing/ /de/pricing/ /fr/pricing/ \
                     /da/pro/ /de/pro/ /fr/pro/ /scan/ /plugin/ /privacy/ /sample/; do
            code=$(curl -sS -o page.html -w '%{http_code}' "$url$route?cb=$GITHUB_RUN_ID" || echo 000)
            bytes=$(wc -c < page.html | tr -d ' ')
            if [ "$code" != "200" ] || [ "$bytes" -lt 1000 ]; then
              echo "FEJL: $route svarer $code ($bytes bytes)"
              fail=1
            else
              echo "OK: $route svarer 200 ($bytes bytes)"
            fi
          done

          # Plugin-downloadet skal være den version, zip'en der _redirects peger på.
          code=$(curl -sS -o plug.zip -w '%{http_code}' "$url/assets/eucomply-1.3.2.zip?cb=$GITHUB_RUN_ID" || echo 000)
          if [ "$code" = "200" ] && [ "$(head -c 2 plug.zip)" = "PK" ]; then
            echo "OK: /assets/eucomply-1.3.2.zip er 200 og en zip-fil"
          else
            echo "FEJL: /assets/eucomply-1.3.2.zip svarer $code"
            fail=1
          fi

          exit $fail
