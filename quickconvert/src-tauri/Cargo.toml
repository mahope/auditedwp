[package]
name = "quickformat"
version = "1.0.0"
description = "QuickFormat — Universal format converter in your menu bar"
authors = ["QuickFormat"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
toml = "0.8"
csv = "1.3"
quick-xml = "0.36"
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
