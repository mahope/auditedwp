<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=400, initial-scale=1">
  <title>DevNotify</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-hover: #334155;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #334155;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --green: #22c55e;
      --red: #ef4444;
      --orange: #f97316;
      --radius: 8px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      width: 400px;
      min-height: 200px;
      font-size: 14px;
      line-height: 1.5;
    }
    .container { display: flex; flex-direction: column; min-height: 200px; }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    header h1 .badge {
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 10px;
      font-weight: 600;
    }
    .header-actions { display: flex; gap: 6px; }
    .header-actions button {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 8px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 12px;
    }
    .header-actions button:hover { background: var(--surface-hover); color: var(--text); }

    /* Status banner (not logged in) */
    .status-banner {
      padding: 12px 16px;
      background: #1e3a5f;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }
    .status-banner.error { background: #3f1e1e; }
    .status-banner.success { background: #1a3f2a; }
    .status-banner .icon { font-size: 16px; }
    .status-banner a {
      color: var(--accent);
      text-decoration: none;
      margin-left: auto;
      font-weight: 600;
    }
    .status-banner a:hover { text-decoration: underline; }

    /* Notification list */
    .notif-list { flex: 1; overflow-y: auto; max-height: 400px; }
    .notif-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.1s;
    }
    .notif-item:hover { background: var(--surface-hover); }
    .notif-item.unread { border-left: 3px solid var(--accent); }
    .notif-item.read { opacity: 0.6; }
    .notif-type {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .notif-type.PullRequest { background: #7c3aed; color: #fff; }
    .notif-type.Issue { background: #22c55e; color: #fff; }
    .notif-type.Commit { background: #f97316; color: #fff; }
    .notif-type.Discussion { background: #3b82f6; color: #fff; }
    .notif-type.Release { background: #eab308; color: #000; }
    .notif-type.CheckSuite { background: #ec4899; color: #fff; }
    .notif-type-default { background: var(--surface); color: var(--text-muted); }

    .notif-content { flex: 1; min-width: 0; }
    .notif-repo {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 1px;
    }
    .notif-title {
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .notif-meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Empty state */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px;
      text-align: center;
      color: var(--text-muted);
    }
    .empty-state .icon { font-size: 32px; margin-bottom: 8px; }
    .empty-state h3 { font-weight: 600; margin-bottom: 4px; color: var(--text); }
    .empty-state p { font-size: 13px; }

    /* Settings screen */
    .settings {
      padding: 16px;
      display: none;
    }
    .settings.visible { display: block; }
    .settings label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--text-muted);
    }
    .settings input[type="text"],
    .settings input[type="password"] {
      width: 100%;
      padding: 8px 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 14px;
      margin-bottom: 12px;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }
    .settings input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(59,130,246,0.3);
    }
    .settings .help {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .settings .help a { color: var(--accent); }
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--surface-hover); }
    .btn-success { background: var(--green); color: #fff; }
    .btn-success:hover { opacity: 0.9; }

    /* Footer */
    footer {
      padding: 8px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-muted);
    }
    footer a { color: var(--text-muted); text-decoration: none; }
    footer a:hover { color: var(--accent); }

    /* Utility */
    .hidden { display: none; }
    .loading {
      padding: 32px;
      text-align: center;
      color: var(--text-muted);
    }
    .loading .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container" id="app">
    <!-- Header -->
    <header>
      <h1>
        <span>🔔</span> DevNotify
        <span class="badge" id="count-badge">0</span>
      </h1>
      <div class="header-actions">
        <button id="btn-refresh" title="Refresh">↻</button>
        <button id="btn-settings" title="Settings">⚙</button>
      </div>
    </header>

    <!-- Status banner -->
    <div id="status-banner" class="status-banner hidden"></div>

    <!-- Main content area -->
    <div id="main-content">
      <!-- Loading -->
      <div id="loading" class="loading">
        <div class="spinner"></div>
        <div>Loading notifications...</div>
      </div>

      <!-- Empty state (no notifications) -->
      <div id="empty-state" class="empty-state hidden">
        <div class="icon">✅</div>
        <h3>All caught up!</h3>
        <p>No new notifications. We'll check again soon.</p>
      </div>

      <!-- Notification list -->
      <div id="notif-list" class="notif-list hidden"></div>
    </div>

    <!-- Settings panel -->
    <div id="settings-panel" class="settings">
      <label for="token">GitHub Personal Access Token</label>
      <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" autocomplete="off">
      <div class="help">
        Create a token with <strong>notifications</strong> scope in
        <a href="https://github.com/settings/tokens" target="_blank">GitHub Settings</a>.
      </div>

      <label for="license-key">License Key (optional — unlocks Pro)</label>
      <input type="text" id="license-key" placeholder="devnotify-XXXX-XXXX-XXXX">
      <div class="help">
        Get a Pro license to unlock: all notifications, 2-min polling, multi-account, GitLab support.
      </div>

      <button id="btn-save" class="btn btn-primary">Save</button>
      <button id="btn-back" class="btn btn-secondary" style="margin-top:8px">Back</button>
    </div>

    <!-- Footer -->
    <footer>
      <span id="footer-status">Not connected</span>
      <a href="https://devnotify.pages.dev" target="_blank">devnotify.pages.dev</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
