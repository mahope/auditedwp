<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevNotify</title>
    <script type="module" src="/main.js" defer></script>
  </head>
  <body>
    <!-- Settings Panel -->
    <div id="settings-panel" class="panel">
      <h2>Settings</h2>
      <div class="form-group">
        <label for="provider-select">Platform</label>
        <select id="provider-select">
          <option value="github">GitHub</option>
          <option value="gitlab">GitLab</option>
        </select>
      </div>
      <div class="form-group">
        <label for="token-input">Access Token</label>
        <input
          id="token-input"
          type="password"
          placeholder="ghp_… / glpat-…"
          autocomplete="off"
        />
        <p class="hint" id="token-hint"></p>
      </div>
      <div class="form-actions">
        <button id="save-token-btn" class="primary">Save Token</button>
        <button id="test-token-btn">Test Connection</button>
      </div>
      <p id="settings-status" class="status-msg"></p>
      <div id="trial-box" class="form-group" style="display:none">
        <label for="license-input">License key</label>
        <input id="license-input" type="text" placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="off" />
        <div class="form-actions" style="margin-top:8px">
          <button id="activate-license-btn" class="primary">Activate License</button>
        </div>
        <p id="license-status" class="status-msg"></p>
      </div>
      <hr />
      <p class="hint">
        Close this window to hide to the menu bar.
        Click the menu bar icon to show notifications.
      </p>
      <button id="show-notifications-btn" class="primary">Show Notifications</button>
    </div>

    <!-- Notifications Panel -->
    <div id="notifications-panel" class="panel" style="display: none">
      <div class="notif-header">
        <h2>Notifications</h2>
        <div class="notif-actions">
          <button id="refresh-notifs-btn">Refresh</button>
          <button id="settings-btn">⚙</button>
        </div>
      </div>
      <div id="unread-badge" class="unread-badge"></div>
      <div id="notification-list" class="notification-list">
        <p class="loading">Checking for notifications…</p>
      </div>
    </div>
  </body>
</html>
